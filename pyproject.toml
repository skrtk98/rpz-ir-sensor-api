[project]
name = "rpz-ir-sensor-api"
version = "1.0.0"
description = "FastAPI interface to RPZ-IR-Sensor environmental sensors and infrared"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cgir>=2.0,<3",
    "cgsensor>=1.2,<2",
    "fastapi>=0.143.0,<1",
    "uvicorn>=0.54.0,<1",
]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.1.1", "ruff>=0.17.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
